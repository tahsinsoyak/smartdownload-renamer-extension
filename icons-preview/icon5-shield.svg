<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Subtle inner glow behind shield -->
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="26" fill="url(#bg5)"/>
  <rect width="128" height="128" rx="26" fill="url(#shieldGlow)"/>
  <!-- Shield shape: pointed bottom -->
  <path d="M64 16 L100 30 L100 70 Q100 98 64 114 Q28 98 28 70 L28 30 Z"
        fill="#0d9488" fill-opacity="0.18"
        stroke="#0d9488" stroke-width="3"
        stroke-linejoin="round"/>
  <!-- Download arrow inside shield (slightly smaller) -->
  <path d="M58 36 L70 36 L70 62 L80 62 L64 82 L48 62 L58 62 Z" fill="white"/>
</svg>
