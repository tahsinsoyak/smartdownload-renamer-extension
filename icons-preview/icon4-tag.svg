<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="26" fill="url(#bg4)"/>
  <!-- Price tag shape: rectangle with right-pointing arrow tip -->
  <path d="M18 30 L94 30 L110 64 L94 98 L18 98 Z"
        fill="white" fill-opacity="0.12"
        stroke="white" stroke-width="3" stroke-opacity="0.72"
        stroke-linejoin="round"/>
  <!-- Hole in tag (left side) -->
  <circle cx="34" cy="64" r="7"
          fill="#0f766e"
          stroke="white" stroke-width="2.5" opacity="0.82"/>
  <!-- Download arrow inside tag (centered in right portion) -->
  <path d="M68 40 L78 40 L78 59 L87 59 L73 76 L59 59 L68 59 Z" fill="white"/>
  <!-- Filename line below arrow -->
  <rect x="52" y="83" width="36" height="4.5" rx="2.25" fill="white" opacity="0.38"/>
</svg>
