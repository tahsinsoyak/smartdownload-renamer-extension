<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background: very light mint -->
  <rect width="128" height="128" rx="26" fill="#f0fdf9"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="25" fill="none" stroke="#ccfbf1" stroke-width="3"/>
  <!-- File 1 — left (original, "messy") -->
  <rect x="10" y="30" width="42" height="56" rx="5" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.5"/>
  <!-- Uneven text lines -->
  <rect x="18" y="44" width="26" height="3.5" rx="1.75" fill="#0d9488" opacity="0.3"/>
  <rect x="18" y="52" width="18" height="3.5" rx="1.75" fill="#0d9488" opacity="0.3"/>
  <rect x="18" y="60" width="24" height="3.5" rx="1.75" fill="#0d9488" opacity="0.3"/>
  <rect x="18" y="68" width="14" height="3.5" rx="1.75" fill="#0d9488" opacity="0.2"/>
  <!-- Arrow between files -->
  <path d="M58 57 L70 57 M65 52 L70 57 L65 62" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- File 2 — right (renamed, "clean") -->
  <rect x="76" y="30" width="42" height="56" rx="5" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.5"/>
  <!-- Even, structured text lines -->
  <rect x="84" y="44" width="26" height="3.5" rx="1.75" fill="#0d9488" opacity="0.55"/>
  <rect x="84" y="52" width="26" height="3.5" rx="1.75" fill="#0d9488" opacity="0.4"/>
  <rect x="84" y="60" width="22" height="3.5" rx="1.75" fill="#0d9488" opacity="0.3"/>
  <!-- Checkmark on file 2 -->
  <path d="M84 70 L90 76 L102 60" stroke="#059669" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Bottom filename strip -->
  <rect x="10" y="98" width="108" height="7" rx="3.5" fill="#0d9488" opacity="0.1"/>
  <rect x="22" y="110" width="84" height="7" rx="3.5" fill="#0d9488" opacity="0.05"/>
</svg>
